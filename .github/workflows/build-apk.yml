name: Build Setly Gym APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: android-twa/android-keystore
          key: setly-gym-android-keystore-v1

      - name: Build PWA
        run: |
          npm ci
          npm run build

      - name: Prepare Android signing key
        env:
          STORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Add BUBBLEWRAP_KEYSTORE_PASSWORD and BUBBLEWRAP_KEY_PASSWORD in GitHub Actions secrets."
            exit 1
          fi
          mkdir -p android-twa
          if [ ! -f android-twa/android-keystore ]; then
            keytool -genkeypair -v               -keystore android-twa/android-keystore               -alias android -keyalg RSA -keysize 2048 -validity 10000               -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD"               -dname "CN=Setly Gym, OU=Android, O=Setly Gym, L=Santa Rosa, ST=RS, C=BR"
          fi

      - name: Initialize Bubblewrap project
        run: |
          npm install --global @bubblewrap/cli
          sudo apt-get update
          sudo apt-get install -y expect
          cat > /tmp/init-bubblewrap.exp <<'EOF'
          set timeout 600
          spawn bubblewrap init --manifest=https://setly-gym.vercel.app/manifest.webmanifest --directory=android-twa
          expect {
            -re {\\?} {
              send -- "\r"
              exp_continue
            }
            eof
          }
          catch wait result
          exit [lindex $result 3]
          EOF
          expect /tmp/init-bubblewrap.exp

      - name: Build signed APK and Digital Asset Links
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          cd android-twa
          bubblewrap build --skipPwaValidation

      - name: Upload APK and Android setup files
        uses: actions/upload-artifact@v4
        with:
          name: setly-gym-android
          path: |
            android-twa/app-release-signed.apk
            android-twa/android-keystore
            android-twa/assetlinks.json
            android-twa/twa-manifest.json
          if-no-files-found: warn
          retention-days: 90
